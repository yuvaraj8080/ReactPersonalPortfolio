<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wfTitle">
  <title id="wfTitle">The vibe coding workflow: describe intent, agent drafts, review the diff, verify and test, ship</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="1" stop-color="#0c0c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.35)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#bg)"/>

  <!-- connecting line -->
  <line x1="204" y1="337" x2="1060" y2="337" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- arrows between nodes -->
  <line x1="204" y1="337" x2="356" y2="337" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="434" y1="337" x2="586" y2="337" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="664" y1="337" x2="816" y2="337" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="894" y1="337" x2="1046" y2="337" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 1: Describe intent -->
  <g transform="translate(140,337)">
    <circle r="92" fill="url(#glow)"/>
    <circle r="64" fill="#0d0d16" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-84" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#3b82f6">STEP 1</text>
    <path d="M-26,-18 h52 a8,8 0 0 1 8,8 v18 a8,8 0 0 1 -8,8 h-30 l-11,12 v-12 h-11 a8,8 0 0 1 -8,-8 v-18 a8,8 0 0 1 8,-8 z" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-9" cy="-2" r="2.4" fill="#3b82f6"/>
    <circle cx="0" cy="-2" r="2.4" fill="#3b82f6"/>
    <circle cx="9" cy="-2" r="2.4" fill="#3b82f6"/>
    <text x="0" y="98" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Describe intent</text>
  </g>

  <!-- Node 2: Agent drafts -->
  <g transform="translate(370,337)">
    <circle r="92" fill="url(#glow)"/>
    <circle r="64" fill="#0d0d16" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-84" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#3b82f6">STEP 2</text>
    <line x1="0" y1="-26" x2="0" y2="-16" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-30" r="3.5" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <rect x="-20" y="-16" width="40" height="32" rx="9" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    <circle cx="-8" cy="0" r="3.2" fill="#3b82f6"/>
    <circle cx="8" cy="0" r="3.2" fill="#3b82f6"/>
    <line x1="-8" y1="11" x2="8" y2="11" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="98" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Agent drafts</text>
  </g>

  <!-- Node 3: Review the diff -->
  <g transform="translate(600,337)">
    <circle r="92" fill="url(#glow)"/>
    <circle r="64" fill="#0d0d16" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-84" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#3b82f6">STEP 3</text>
    <path d="M-27,0 C -15,-17 15,-17 27,0 C 15,17 -15,17 -27,0 Z" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="2.6" fill="#3b82f6"/>
    <text x="0" y="98" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Review the diff</text>
  </g>

  <!-- Node 4: Verify and test -->
  <g transform="translate(830,337)">
    <circle r="92" fill="url(#glow)"/>
    <circle r="64" fill="#0d0d16" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-84" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#3b82f6">STEP 4</text>
    <circle r="30" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <polyline points="-14,1 -4,13 16,-12" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="98" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Verify &amp; test</text>
  </g>

  <!-- Node 5: Ship -->
  <g transform="translate(1060,337)">
    <circle r="92" fill="url(#glow)"/>
    <circle r="64" fill="#0d0d16" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-84" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#3b82f6">STEP 5</text>
    <path d="M0,-27 L11,-8 L-11,-8 Z" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-11" y="-8" width="22" height="24" rx="8" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
    <circle cx="0" cy="2" r="4.5" fill="none" stroke="#3b82f6" stroke-width="2.8"/>
    <path d="M-11,10 L-21,22 L-11,17 Z" fill="#3b82f6"/>
    <path d="M11,10 L21,22 L11,17 Z" fill="#3b82f6"/>
    <text x="0" y="98" text-anchor="middle" font-family="Poppins, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Ship</text>
  </g>
</svg>
